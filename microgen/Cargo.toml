[package]
name = "microgen"
version = "0.2.1"
edition = "2021"

[dependencies]
chrono = "0.4"
clap = { version = "4.5.4", features = [
    "string",
    "env",
    "unicode",
    "unstable-doc",
    "unstable-styles",
    "wrap_help",
] }
colored = "2.1.0"
cpio = "0.4.0"
#kmoddep = "0.1.5"
kmoddep = { git = "https://github.com/phodina/kmoddep", branch = "todo-implementation" }
nix = { version = "0.28.0", features = [
    "kmod",
    "default",
    "mount",
    "hostname",
    "fs",
    "feature",
    "env",
    "dir",
    "aio",
    "acct",
    "inotify",
    "user",
    "zerocopy",
    "uio",
    "event",
    "fanotify",
    "ioctl",
    "mman",
    "mqueue",
    "net",
    "personality",
    "poll",
    "process",
    "pthread",
    "ptrace",
    "quota",
    "reboot",
    "resource",
    "sched",
    "socket",
    "term",
    "ucontext",
    "time",
] }

profile = { path = "../profile" }
syslib = { path = "../syslib" }
walkdir = "2.5.0"
zstd = "0.13.1"

[features]
default = ["fsck"]
fsck = []
nixos = ["profile/nixos"]
